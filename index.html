<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inspiration Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23f5f0e6'/%3E%3Crect x='1' y='1' width='6' height='6' fill='%23000'/%3E%3Crect x='9' y='1' width='6' height='6' fill='%23C5E0A0'/%3E%3Crect x='1' y='9' width='6' height='6' fill='%23A8D4C8'/%3E%3Crect x='9' y='9' width='6' height='6' fill='%23000'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar__brand">
        <span class="sidebar__title">виджеты</span>
      </div>
      <nav class="toolbar">
        <button id="btn-add-palette" class="btn btn--tiny" type="button">Палитра</button>
        <button id="btn-add-giphy" class="btn btn--tiny" type="button">GIF</button>
        <button id="btn-add-workdays" class="btn btn--tiny" type="button">Раб. дни</button>
        <button id="btn-add-ghibli" class="btn btn--tiny" type="button">Ghibli</button>
        <button id="btn-add-advice" class="btn btn--tiny" type="button">Совет</button>
        <button id="btn-add-datetime" class="btn btn--tiny" type="button">Время</button>
        <button id="btn-add-random" class="btn btn--tiny" type="button">Число</button>
        <button id="btn-add-ideas" class="btn btn--tiny" type="button">Идеи</button>
      </nav>
      <div class="sidebar__bottom">
        <button id="refresh-all-btn" class="btn btn--ghost" type="button">↻ ОБНОВИТЬ ВСЁ</button>
      </div>
    </aside>

    <div class="main-area">
      <header class="header">
        <div class="header__left">
          <h1 class="header__title">ПОИСК ВДОХНОВЕНИЯ</h1>
          <p class="header__subtitle"> ⊹ ₊  ⁺‧₊ ˚⊹ ₊  ⁺‧  ₊˚⊹ ₊  ⁺‧₊˚⊹   ₊⁺‧  ₊ ˚⊹ ₊  ⁺‧  ₊˚⊹ ₊  ⁺‧ ₊˚</p>
        </div>
      </header>

      <main id="dashboard" class="dashboard">
        <!-- Виджеты добавляются через Dashboard -->
      </main>

      <footer class="footer">
        <span>6 MODULES · COLORMIND + GIPHY + NAGER.DATE + GHIBLI + ADVICE</span>
      </footer>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
